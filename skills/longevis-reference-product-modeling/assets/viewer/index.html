<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product 3D Viewer</title>
<style>
:root{font-family:system-ui,sans-serif;color:#24342c;background:#f1f4f2}body{margin:0}header,nav,footer{padding:14px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}header{background:white;border-bottom:1px solid #dce3de}h1{font-size:18px;margin:0 auto 0 0}button,select,.file-label{font:inherit;font-size:13px;padding:8px 12px;border:1px solid #bbc9c0;border-radius:6px;background:white;color:inherit;cursor:pointer}button:disabled,select:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid #7caf94}model-viewer{width:100%;height:64vh;min-height:360px;background:radial-gradient(#fcfdfc,#dfe7e1)}footer{font-size:12px;line-height:1.7;color:#57695e}#status{padding:0 20px;font-size:13px}#time{width:180px}#file{max-width:215px}label{font-size:13px}@media(max-width:600px){header,nav,footer{padding:12px;gap:7px}button{padding:8px}h1{width:100%}model-viewer{height:55vh}}
</style>
<header><a href="index.zh-CN.html" lang="zh-CN">中文</a><h1>Product 3D Viewer</h1><label>Load GLB <input type="file" id="file" accept=".glb"></label><button id="refresh">Refresh model</button></header>
<model-viewer id="viewer" camera-controls camera-orbit="35deg 78deg auto" min-camera-orbit="auto 0deg auto" max-camera-orbit="auto 180deg auto" environment-image="neutral" shadow-intensity="0.5" interaction-prompt="none" animation-crossfade-duration="0" alt="3D product model"></model-viewer>
<p id="status" role="status">Initializing…</p>
<nav aria-label="Views"><button data-view="0,90" disabled>Front</button><button data-view="180,90" disabled>Rear</button><button data-view="-90,90" disabled>Left</button><button data-view="90,90" disabled>Right</button><button data-view="0,0" disabled>Top</button><button data-view="0,180" disabled>Bottom</button><button id="reset" disabled>Reset view</button><button id="spin" disabled>Auto-rotate</button></nav>
<nav aria-label="Animation"><label>Animation <select id="clips" disabled><option>No animations</option></select></label><button id="play" disabled>Play</button><input id="time" type="range" min="0" max="1000" value="0" aria-label="Animation progress" disabled><span id="progress">0%</span></nav>
<footer>Drag to rotate; scroll to zoom. Loads model.glb from this directory, or choose a local GLB with embedded textures. Animations come from the model; this template does not create hinges or interior geometry.</footer>
<script type="module" src="viewer.en.js"></script>
</html>
